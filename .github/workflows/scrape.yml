name: Daily Scrape

on:
  schedule:
    - cron: "30 19 * * *" # UTC 19:30 = JST 04:30
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run scrape
        run: npm run scrape

      - name: Run convert
        run: npm run convert

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw_shops.json data/shops.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update shop data ($(date +%Y-%m-%d))"
          git push
